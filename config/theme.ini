; UMD Libraries Exhibits — Omeka S theme
;
; One theme serves every exhibit below the Major tier. Per-exhibit variation
; comes from [config] below; there are deliberately no forks. See README.md.

[info]
name = "UMD Libraries Omeka Theme"
version = "0.1.0"
author = "UMD Libraries"
description = "Shared theme for UMD Libraries digital exhibits. Carries the Libraries design system and a fixed vocabulary of page and item layouts."
omeka_version_constraint = "^4.2.0"


; ---------------------------------------------------------------------------
; [config] — the per-exhibit settings form.
;
; This is the product. Lite, Standard and Enhanced tiers all run this theme
; with no code changes, so anything that must differ between exhibits has to
; be expressible here or it cannot happen. Every element type below is
; verified present in Omeka S 4.2.1 application/src/Form/Element/.
; ---------------------------------------------------------------------------
[config]

; ---------- Identity ----------
elements.hero_image.name = "hero_image"
elements.hero_image.type = "Omeka\Form\Element\Asset"
elements.hero_image.options.label = "Exhibit hero image"

elements.hero_height.name = "hero_height"
elements.hero_height.type = "Omeka\Form\Element\LengthCssDataType"
elements.hero_height.options.label = "Hero height"
elements.hero_height.options.info = "CSS length. Leave blank for the design-system default."

elements.hero_treatment.name = "hero_treatment"
elements.hero_treatment.type = "Laminas\Form\Element\Select"
elements.hero_treatment.options.label = "Hero treatment"
elements.hero_treatment.options.value_options.band = "Title band over image"
elements.hero_treatment.options.value_options.stacked = "Title beneath image"
elements.hero_treatment.options.value_options.plain = "Title only, no image"
elements.hero_treatment.attributes.value = "band"

; ---------- Provenance ----------
; Institutionally required on every exhibit, so it is a field rather than
; something a curator remembers to type into an HTML block.
elements.holding_unit.name = "holding_unit"
elements.holding_unit.type = "Laminas\Form\Element\Select"
elements.holding_unit.options.label = "Holding unit"
elements.holding_unit.options.value_options.scua = "Special Collections and University Archives"
elements.holding_unit.options.value_options.mspal = "Michelle Smith Performing Arts Library"
elements.holding_unit.options.value_options.other = "Other or multiple"

elements.credit_line.name = "credit_line"
elements.credit_line.type = "Omeka\Form\Element\HtmlTextarea"
elements.credit_line.options.label = "Curatorial credit and sponsors"

elements.about_html.name = "about_html"
elements.about_html.type = "Omeka\Form\Element\HtmlTextarea"
elements.about_html.options.label = "About this exhibit"
elements.about_html.options.info = "Shown in the footer, above the credit line."

elements.find_us_html.name = "find_us_html"
elements.find_us_html.type = "Omeka\Form\Element\HtmlTextarea"
elements.find_us_html.options.label = "Information for the Collection's physical location"
elements.find_us_html.options.info = "Shown in the footer, alongside the about text."

; ---------- Lifecycle ----------
; Lite exhibits sunset after one year; Standard renews at three. The service
; model therefore creates exhibits that are live but unmaintained, and nothing
; in Omeka expresses that state. This does.
elements.lifecycle_state.name = "lifecycle_state"
elements.lifecycle_state.type = "Laminas\Form\Element\Select"
elements.lifecycle_state.options.label = "Lifecycle state"
elements.lifecycle_state.options.info = "Drives a standing notice. Required by the Sunsetting Guidelines."
elements.lifecycle_state.options.value_options.live = "Live and maintained"
elements.lifecycle_state.options.value_options.archived = "Archived — no longer updated"
elements.lifecycle_state.options.value_options.sunsetting = "Scheduled for removal"
elements.lifecycle_state.attributes.value = "live"

elements.lifecycle_note.name = "lifecycle_note"
elements.lifecycle_note.type = "Omeka\Form\Element\HtmlTextarea"
elements.lifecycle_note.options.label = "Lifecycle notice text (optional override)"

; ---------- Appearance ----------
; A Select over curated token sets, NOT Omeka\Form\Element\ColorPicker.
; A free colour input guarantees off-brand, unaudited contrast pairs.
elements.accent.name = "accent"
elements.accent.type = "Laminas\Form\Element\Select"
elements.accent.options.label = "Accent palette"
elements.accent.options.info = "Design-system token sets. Each is checked for WCAG AA contrast."
elements.accent.options.value_options.red = "Maryland Red (default)"
elements.accent.options.value_options.ink = "Ink"
elements.accent.options.value_options.archival = "Archival"
elements.accent.attributes.value = "red"

; ---------- Navigation ----------
elements.nav_depth.name = "nav_depth"
elements.nav_depth.type = "Number"
elements.nav_depth.options.label = "Navigation depth"
elements.nav_depth.options.info = "0 shows all levels. Standard-tier exhibits use nested navigation."
elements.nav_depth.attributes.min = 0
elements.nav_depth.attributes.value = 0

; ---------- Item display ----------
elements.item_properties.name = "item_properties"
elements.item_properties.type = "Omeka\Form\Element\PropertySelect"
elements.item_properties.options.label = "Properties shown on item pages"
elements.item_properties.attributes.multiple = true

; ---------- Analytics ----------
; Renewal requires Matomo usage evidence and traffic cannot be backfilled,
; so this is a first-class setting rather than a step someone might skip.
elements.matomo_site_id.name = "matomo_site_id"
elements.matomo_site_id.type = "Number"
elements.matomo_site_id.options.label = "Matomo site ID"
elements.matomo_site_id.options.info = "A site without this cannot demonstrate use at renewal."


; ---------------------------------------------------------------------------
; block_templates — named layout treatments offered to page editors.
;
; Format: block_templates.<blockType>.<filename> = "Label shown in dropdown"
; Files live in view/common/block-template/<filename>.phtml
;
; SEVEN. An earlier draft had thirteen. Surveying the 28 legacy
; exhibits showed the shared component vocabulary is small — hero, captioned
; plate, lightbox, gallery, prose, callout — and that layout itself (columns,
; alignment, spacing, backgrounds) is already per-block in Omeka S 4.x through
; the page editor, so a theme supplying layout templates duplicates core.
;
; Each entry is a file to maintain forever and an option a Creator-role curator
; must reason about with no preview. Thirteen was a worse authoring surface,
; not a richer one.
;
; Every block type below is core. The theme has NO Block Plus dependency, so it
; works on the unmodified umd-omeka image.
; ---------------------------------------------------------------------------
block_templates.pageTitle.exhibit-hero          = "Exhibit hero"
block_templates.html.essay                      = "Essay"
block_templates.html.callout                    = "Callout"
; Seventh, and deliberately not folded into Callout: this one carries
; role="note" and a fixed label, which a curator cannot supply by typing
; the right words into a callout. DC Punk needs one and will not be alone.
block_templates.html.content-notice             = "Content notice"
; Pull quote — exhibits highlight phrases and nothing else covers it. Rides the
; html block; any attribution is inline in the curator's prose because the
; block has no separate author field.
block_templates.html.pull-quote                 = "Pull quote"
block_templates.itemWithMetadata.plate          = "Captioned plate"
block_templates.browsePreview.gallery           = "Gallery"
block_templates.browsePreview.lightbox-gallery  = "Gallery with lightbox"
block_templates.browsePreview.browse-preview-card = "Browse Preview (Custom Card)"


; ---------------------------------------------------------------------------
; resource_page_blocks — what appears on generated item / item-set / media
; pages, which nobody builds by hand.
;
; Core only, for the same reason as above: the theme must work on the image as
; shipped. Block Plus would add citationResource, previousNext, seeAlso and
; thumbnail here — previousNext most of all, since without it every flier in a
; gallery is a dead end back to the grid. Add them once Block Plus is in the
; Dockerfile; until then their absence is a known gap, not an oversight.
; ---------------------------------------------------------------------------
resource_page_blocks.items.main[] = "mediaEmbeds"
resource_page_blocks.items.main[] = "values"
resource_page_blocks.items.main[] = "itemSets"
resource_page_blocks.items.main[] = "linkedResources"
resource_page_blocks.item_sets.main[] = "values"
resource_page_blocks.media.main[] = "mediaRender"
resource_page_blocks.media.main[] = "values"
